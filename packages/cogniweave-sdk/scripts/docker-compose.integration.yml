services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cogniweave
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cogniweave"]
      interval: 3s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5.21
    environment:
      NEO4J_AUTH: neo4j/neo4jpass
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4jpass 'RETURN 1;' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
