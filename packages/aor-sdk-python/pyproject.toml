[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aor-sdk"
version = "0.1.0"
description = "Python SDK for the Agent Orchestration Runtime (OpenBot Gateway HTTP client)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenBot" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["aor_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
