# Nginx vhost for admin.openbot.love (OpenBot platform console)
# Install path: /etc/nginx/conf.d/admin.openbot.love.conf
#
# WHY THIS EXISTS
# ---------------
# admin.openbot.love serves the OpenBot control-ui SPA, which talks to the
# OpenBot gateway over SAME-ORIGIN paths:
#   - GET  /__openbot/control-ui-config.json   (bootstrap config; drives platformAuth.enabled)
#   - POST /__openbot/platform-auth/*          (login / bootstrap / session)
#   - WebSocket upgrade on /                    (live gateway connection + data)
# The gateway itself serves the SPA bundle at /, so the simplest correct setup
# is a PURE reverse proxy: forward everything to the gateway and let it serve
# SPA + API + WebSocket from one origin. This avoids static-bundle/gateway
# version skew and the /__openbot/* 404 that breaks login.
#
# REQUIREMENTS ON THIS HOST (see deploy/admin-subdomain/README.md for full steps;
# authoritative reference: docs/gateway/trusted-proxy-deployment-examples.md)
# -------------------------
# 1. The OpenBot gateway MUST run on THIS machine, bound to loopback:18789.
#    Firewall :18789 so only this proxy can reach it.
# 2. Gateway config (json5), the parts that make platform login work:
#      gateway.bind: "loopback"
#      gateway.trustedProxies: ["127.0.0.1", "::1"]
#      gateway.auth.mode: "trusted-proxy"
#      gateway.auth.trustedProxy.userHeader: "x-forwarded-user"   // required field
#      gateway.auth.trustedProxy.platformAuth.enabled: true       // enables /__openbot/platform-auth/*
#      gateway.controlUi.allowedOrigins: [ ... "https://admin.openbot.love" ]  // REQUIRED or the WS handshake rejects the origin
#    Env: OPENBOT_PUBLIC_APP_BASE_URL=https://admin.openbot.love
#         (lets the gateway allow the public /login route for this host)
#
# This block is the cookie-native "fast path": the browser logs in via
# /__openbot/platform-auth/login (cookie), which the gateway translates into a
# trusted-proxy session. If instead you front OpenBot with a BFF/SSO that injects
# x-forwarded-user etc., use the auth_request pattern from
# docs/gateway/trusted-proxy-deployment-examples.md ("nginx: one upstream, per-domain
# server blocks") instead of this block.
#
# TLS: run `certbot --nginx -d admin.openbot.love` after this block is live over
# HTTP; certbot injects `listen 443 ssl` + the managed cert lines and adds an
# 80->443 redirect block, preserving the directives below.
# After certbot, ensure the 443 listeners include http2, e.g.:
#   listen 443 ssl http2;
#   listen [::]:443 ssl http2;
# (nginx 1.24.x; on 1.25.1+ prefer `listen 443 ssl;` + `http2 on;`.)

server {
    listen 80;
    listen [::]:80;
    server_name admin.openbot.love;

    # ---- Let's Encrypt HTTP-01 challenge (webroot fallback) --------------
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html/current/public;
        try_files $uri =404;
    }

    # ---- Security headers ------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
    # Enable HSTS only after HTTPS is confirmed working end-to-end:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- gzip ------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Control-ui bundle can be multi-MB; give proxied bodies room.
    client_max_body_size 25m;

    # ---- Everything -> OpenBot gateway (SPA + /__openbot/* + WebSocket) ---
    location / {
        proxy_pass         http://127.0.0.1:18789;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Required so the gateway's isConfiguredPublicPlatformRequest() sees the
        # public scheme + host and allows the public /login route.
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        # WebSocket upgrade (gateway live connection).
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /var/log/nginx/admin.openbot.love.access.log;
    error_log  /var/log/nginx/admin.openbot.love.error.log;
}
