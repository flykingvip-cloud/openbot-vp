# Extract of static apex locations. Source of truth is inlined in
# deploy/production/proxy/nginx/apex.openbot.love.conf (host file:
# /etc/nginx/conf.d/openbot.love.conf). Keep this file in sync with that vhost.
#
# Insert BEFORE the catch-all `location /` that proxy_passes to the gateway.
# Files live in /var/www/openbot-downloads/ (install.sh, install-cli.sh, install.ps1, zips).
# Host: mkdir -p /var/www/openbot-downloads
#       cp scripts/install.sh scripts/install-cli.sh scripts/install.ps1 /var/www/openbot-downloads/
#       nginx -t && systemctl reload nginx
# /install-cli.sh is served from scripts/install-cli.sh (local-prefix CLI installer).

location = /install.sh {
    if ($scheme = http) { return 308 https://$host$request_uri; }
    alias /var/www/openbot-downloads/install.sh;
    types { }
    default_type application/x-sh;
    add_header Content-Disposition 'inline; filename="install.sh"';
    add_header Cache-Control "public, max-age=300, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

location = /install-cli.sh {
    if ($scheme = http) { return 308 https://$host$request_uri; }
    alias /var/www/openbot-downloads/install-cli.sh;
    types { }
    default_type application/x-sh;
    add_header Content-Disposition 'inline; filename="install-cli.sh"';
    add_header Cache-Control "public, max-age=300, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

location = /install.ps1 {
    if ($scheme = http) { return 308 https://$host$request_uri; }
    alias /var/www/openbot-downloads/install.ps1;
    types { }
    default_type text/plain;
    add_header Content-Disposition 'inline; filename="install.ps1"';
    add_header Cache-Control "public, max-age=300, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

location ^~ /downloads/ {
    alias /var/www/openbot-downloads/;
    default_type application/octet-stream;
    add_header Content-Disposition "attachment";
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
}
