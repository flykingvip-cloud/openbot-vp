<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>企业信息管理 · 数智化自评</title>
    <style>
      :root {
        --bg: #f6f8fb;
        --card: #ffffff;
        --ink: #0e1a2b;
        --sub: #4b5c72;
        --weak: #93a1b5;
        --line: #e3e8f0;
        --navy: #123a7a;
        --blue: #2563eb;
        --gold: #ae8b4c;
        --ok: #16a34a;
        --warn: #dc2626;
        --fill: #f3f6fa;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
      }
      .page {
        max-width: 1180px;
        margin: 0 auto;
        padding: 18px 16px 48px;
      }
      header.hero {
        background: linear-gradient(135deg, #123a7a, #2563eb);
        color: #fff;
        border-radius: 18px;
        padding: 22px 22px 18px;
        margin-bottom: 16px;
      }
      header.hero h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      header.hero p {
        margin: 0;
        font-size: 13px;
        opacity: 0.9;
      }
      .hero-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-end;
        flex-wrap: wrap;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .btn {
        border: none;
        border-radius: 10px;
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(135deg, var(--navy), var(--blue));
      }
      .btn.ghost {
        background: #fff;
        color: var(--navy);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
      header.hero .btn.ghost {
        border-color: rgba(255, 255, 255, 0.45);
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
      }
      .stats {
        display: flex;
        gap: 18px;
        margin-top: 14px;
        font-size: 12px;
        opacity: 0.95;
      }
      .stats b {
        font-size: 18px;
        display: block;
      }
      .shell {
        display: grid;
        grid-template-columns: minmax(260px, 340px) 1fr;
        gap: 14px;
        min-height: 560px;
      }
      .pane {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .pane h2 {
        margin: 0;
        padding: 14px 16px 0;
        font-size: 15px;
      }
      .filters {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        align-items: center;
      }
      .filters input,
      .filters select,
      label.field input,
      label.field select,
      label.field textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px 10px;
        font-size: 13px;
        background: #fff;
        color: var(--ink);
      }
      .filters input {
        flex: 1;
      }
      .filters select {
        width: 120px;
        flex: 0 0 120px;
      }
      .list {
        overflow: auto;
        flex: 1;
      }
      .row {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
        background: transparent;
        padding: 12px 16px;
        cursor: pointer;
        color: inherit;
      }
      .row:hover,
      .row.on {
        background: var(--fill);
      }
      .row .co {
        font-weight: 700;
        font-size: 14px;
      }
      .row .meta {
        font-size: 12px;
        color: var(--sub);
        margin-top: 2px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .pill {
        font-size: 11px;
        font-weight: 700;
        border-radius: 6px;
        padding: 1px 7px;
      }
      .st-new {
        background: #dbeafe;
        color: #1d4ed8;
      }
      .st-contacted {
        background: #fef3c7;
        color: #b45309;
      }
      .st-diagnosed {
        background: #dcfce7;
        color: #166534;
      }
      .st-archived {
        background: #f1f5f9;
        color: #475569;
      }
      .detail {
        padding: 8px 16px 18px;
        overflow: auto;
        flex: 1;
      }
      .kv {
        display: grid;
        grid-template-columns: 88px 1fr;
        gap: 6px 12px;
        padding: 8px 0;
        border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
        font-size: 13px;
      }
      .kv:last-of-type {
        border-bottom: 0;
      }
      .kv .k {
        color: var(--sub);
      }
      .kv .v {
        color: var(--ink);
        font-weight: 600;
      }
      .empty {
        color: var(--sub);
        padding: 28px 16px;
        font-size: 13px;
      }
      .form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding-top: 8px;
      }
      label.field {
        display: block;
        font-size: 12px;
        color: var(--sub);
      }
      label.field span {
        display: block;
        margin-bottom: 4px;
      }
      label.field.full {
        grid-column: 1/-1;
      }
      label.field textarea {
        min-height: 88px;
        resize: vertical;
      }
      .form-actions {
        grid-column: 1/-1;
        display: flex;
        gap: 8px;
      }
      .note {
        font-size: 12px;
        color: var(--weak);
        margin: 8px 0 0;
      }
      .err {
        color: var(--warn);
        font-size: 13px;
        margin: 8px 0;
      }
      .ok {
        color: var(--ok);
        font-size: 13px;
        margin: 8px 0;
      }
      @media (max-width: 820px) {
        .shell {
          grid-template-columns: 1fr;
        }
        .form {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="hero-row">
          <div>
            <h1>企业信息管理</h1>
            <p>收集自评预约与顾问补录 · 与公开问卷同一份名单</p>
          </div>
          <div class="actions">
            <button class="btn ghost" id="btnCreate">补录企业</button>
            <button class="btn ghost" id="btnExport">导出 CSV</button>
            <a class="btn ghost" href="/assess" style="text-decoration: none">打开自评页</a>
          </div>
        </div>
        <div class="stats">
          <div><b id="stAll">0</b>全部</div>
          <div><b id="stNew">0</b>待联系</div>
          <div><b id="stWeek">0</b>本周新增</div>
        </div>
      </header>

      <div class="shell">
        <section class="pane">
          <h2>企业名单</h2>
          <div class="filters">
            <input id="q" placeholder="搜索公司 / 姓名 / 电话" />
            <select id="status">
              <option value="">全部状态</option>
              <option value="new">待联系</option>
              <option value="contacted">已联系</option>
              <option value="diagnosed">已诊断</option>
              <option value="archived">已归档</option>
            </select>
          </div>
          <div class="list" id="list"><div class="empty">加载中…</div></div>
        </section>
        <section class="pane">
          <h2 id="detailTitle">企业详情</h2>
          <div class="detail" id="detail">
            <div class="empty">从左侧选择一家企业，或点「补录企业」。</div>
          </div>
        </section>
      </div>
    </div>
    <script>
      const STATUS_LABEL = {
        new: "待联系",
        contacted: "已联系",
        diagnosed: "已诊断",
        archived: "已归档",
      };
      const INDUSTRIES = ["食品", "美妆", "母婴", "家居", "服饰", "其他"];
      const SCALES = ["年营收 < 5000万", "5000万–1亿", "1亿–5亿", "5亿–20亿", "> 20亿"];
      const ROLES = ["企业主/CEO", "财务负责人", "供应链负责人", "HR 负责人", "其他"];
      let rows = [];
      let selectedId = null;
      let mode = "view";

      const $ = (id) => document.getElementById(id);

      async function api(path, opts = {}) {
        const url = new URL("/assess/admin/api" + path, window.location.origin).toString();
        const res = await fetch(url, {
          credentials: "include",
          headers: { "content-type": "application/json", ...(opts.headers || {}) },
          ...opts,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "请求失败 " + res.status);
        return data;
      }

      function fmtTime(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return iso;
        const p = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      }

      function sourceLabel(s) {
        return s === "manual" ? "顾问补录" : "在线自评";
      }

      function renderStats() {
        const weekAgo = Date.now() - 7 * 24 * 3600 * 1000;
        $("stAll").textContent = rows.length;
        $("stNew").textContent = rows.filter((r) => r.status === "new").length;
        $("stWeek").textContent = rows.filter((r) => Date.parse(r.createdAt) >= weekAgo).length;
      }

      function renderList() {
        const q = $("q").value.trim().toLowerCase();
        const st = $("status").value;
        const filtered = rows.filter((r) => {
          if (st && r.status !== st) return false;
          if (!q) return true;
          return `${r.company} ${r.name} ${r.phone} ${r.industry}`.toLowerCase().includes(q);
        });
        if (!filtered.length) {
          $("list").innerHTML = '<div class="empty">暂无匹配企业。</div>';
          return;
        }
        $("list").innerHTML = filtered
          .map(
            (r) => `
    <button class="row ${r.id === selectedId ? "on" : ""}" data-id="${r.id}">
      <div class="co">${escapeHtml(r.company)}</div>
      <div class="meta">
        <span class="pill st-${r.status}">${STATUS_LABEL[r.status] || r.status}</span>
        <span>${escapeHtml(r.name || "未填姓名")}</span>
        <span>${escapeHtml(r.industry || "")}</span>
      </div>
    </button>`,
          )
          .join("");
        $("list")
          .querySelectorAll(".row")
          .forEach((btn) => {
            btn.onclick = () => selectLead(btn.dataset.id);
          });
      }

      function escapeHtml(s) {
        return String(s || "").replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      }

      function options(list, val) {
        return list
          .map((v) => `<option ${v === val ? "selected" : ""}>${escapeHtml(v)}</option>`)
          .join("");
      }

      function scoreRows(lead) {
        const s = lead.scores;
        if (!s)
          return '<div class="kv"><div class="k">自评结果</div><div class="v">尚未提交评分</div></div>';
        const mods = s.moduleScores || {};
        const names = {
          oa: "OA管理",
          fin: "财务记账分析",
          sc: "供应链进销存",
          ch: "门店渠道",
          hr: "招聘效率",
          org: "组织人效",
        };
        const lines = Object.keys(names)
          .map((k) => {
            const now = mods[k] == null ? "—" : Number(mods[k]).toFixed(1);
            return `${names[k]} ${now}`;
          })
          .join(" · ");
        return `
    <div class="kv"><div class="k">综合得分</div><div class="v">${s.overall100 ?? "—"} /100　${escapeHtml(s.level || "")}</div></div>
    <div class="kv"><div class="k">六维现状</div><div class="v">${escapeHtml(lines)}</div></div>`;
      }

      function renderDetail() {
        if (mode === "create") {
          $("detailTitle").textContent = "补录企业";
          $("detail").innerHTML = leadForm(null);
          bindForm(null);
          return;
        }
        const lead = rows.find((r) => r.id === selectedId);
        if (!lead) {
          $("detailTitle").textContent = "企业详情";
          $("detail").innerHTML = '<div class="empty">从左侧选择一家企业，或点「补录企业」。</div>';
          return;
        }
        $("detailTitle").textContent = lead.company;
        $("detail").innerHTML = `
    <div class="kv"><div class="k">状态</div><div class="v"><span class="pill st-${lead.status}">${STATUS_LABEL[lead.status]}</span></div></div>
    <div class="kv"><div class="k">来源</div><div class="v">${sourceLabel(lead.source)}</div></div>
    <div class="kv"><div class="k">入库时间</div><div class="v">${fmtTime(lead.createdAt)}</div></div>
    ${scoreRows(lead)}
    ${leadForm(lead)}
  `;
        bindForm(lead);
      }

      function leadForm(lead) {
        const creating = !lead;
        return `
    <form class="form" id="leadForm">
      ${
        creating
          ? `
      <label class="field"><span>企业名称</span><input name="company" required placeholder="必填" /></label>
      <label class="field"><span>联系人</span><input name="name" placeholder="姓名或称呼" /></label>
      <label class="field"><span>电话</span><input name="phone" placeholder="手机或座机" /></label>
      <label class="field"><span>行业</span><select name="industry">${options(INDUSTRIES, "食品")}</select></label>
      <label class="field"><span>规模</span><select name="scale">${options(SCALES, SCALES[0])}</select></label>
      <label class="field"><span>职位</span><select name="role">${options(ROLES, ROLES[0])}</select></label>
      `
          : `
      <label class="field"><span>企业名称</span><input name="company" required value="${escapeHtml(lead.company)}" /></label>
      <label class="field"><span>联系人</span><input name="name" value="${escapeHtml(lead.name)}" /></label>
      <label class="field"><span>电话</span><input name="phone" value="${escapeHtml(lead.phone)}" /></label>
      <label class="field"><span>行业</span><select name="industry">${options(INDUSTRIES, lead.industry)}</select></label>
      <label class="field"><span>规模</span><select name="scale">${options(SCALES, lead.scale)}</select></label>
      <label class="field"><span>职位</span><select name="role">${options(ROLES, lead.role)}</select></label>
      `
      }
      <label class="field"><span>跟进状态</span>
        <select name="status">${Object.entries(STATUS_LABEL)
          .map(
            ([k, v]) =>
              `<option value="${k}" ${(!lead && k === "new") || (lead && lead.status === k) ? "selected" : ""}>${v}</option>`,
          )
          .join("")}</select>
      </label>
      <label class="field full"><span>顾问备注</span><textarea name="notes" placeholder="沟通记录、薄弱项、下次动作">${lead ? escapeHtml(lead.notes) : ""}</textarea></label>
      <div class="form-actions">
        <button class="btn" type="submit">${creating ? "保存入库" : "保存修改"}</button>
        ${creating ? '<button class="btn ghost" type="button" id="btnCancelCreate" style="background:#fff;color:var(--navy);border:1px solid var(--line)">取消</button>' : ""}
      </div>
      <p class="note" id="formMsg"></p>
    </form>`;
      }

      function formPayload(form) {
        const fd = new FormData(form);
        return Object.fromEntries(fd.entries());
      }

      function bindForm(lead) {
        const form = $("leadForm");
        const cancel = $("btnCancelCreate");
        if (cancel)
          cancel.onclick = () => {
            mode = "view";
            renderDetail();
          };
        form.onsubmit = async (e) => {
          e.preventDefault();
          const payload = formPayload(form);
          const msg = $("formMsg");
          msg.className = "note";
          msg.textContent = "保存中…";
          try {
            if (!lead) {
              const created = await api("/manual", {
                method: "POST",
                body: JSON.stringify(payload),
              });
              await refresh();
              selectedId = created.lead.id;
              mode = "view";
              renderList();
              renderDetail();
            } else {
              await api("/leads/" + lead.id, { method: "PATCH", body: JSON.stringify(payload) });
              await refresh();
              renderList();
              renderDetail();
              $("formMsg").className = "ok";
              $("formMsg").textContent = "已保存";
            }
          } catch (err) {
            msg.className = "err";
            msg.textContent = err.message;
          }
        };
      }

      async function refresh() {
        const data = await api("/leads");
        rows = data.leads || [];
        renderStats();
      }

      function selectLead(id) {
        selectedId = id;
        mode = "view";
        renderList();
        renderDetail();
      }

      function toCsv() {
        const cols = [
          "id",
          "company",
          "name",
          "phone",
          "industry",
          "scale",
          "role",
          "status",
          "source",
          "notes",
          "overall100",
          "level",
          "createdAt",
        ];
        const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
        const lines = [cols.join(",")].concat(
          rows.map((r) =>
            cols
              .map((c) => {
                if (c === "overall100") return esc(r.scores && r.scores.overall100);
                if (c === "level") return esc(r.scores && r.scores.level);
                return esc(r[c]);
              })
              .join(","),
          ),
        );
        const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "企业信息_" + Date.now() + ".csv";
        a.click();
        URL.revokeObjectURL(a.href);
      }

      $("q").oninput = renderList;
      $("status").onchange = renderList;
      $("btnCreate").onclick = () => {
        mode = "create";
        selectedId = null;
        renderList();
        renderDetail();
      };
      $("btnExport").onclick = toCsv;

      (async function init() {
        try {
          await refresh();
          renderList();
          renderDetail();
        } catch (err) {
          $("list").innerHTML =
            `<div class="empty">${escapeHtml(err.message)}。若刚打开本页，请确认已通过管理口令登录。</div>`;
        }
      })();
    </script>
  </body>
</html>
