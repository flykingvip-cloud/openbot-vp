# Cookie-native reverse proxy template (Wave 2).
# Replace biz.openbot.love e.g. admin.openbot.love
# Requires: openbot_gateway upstream (00-openbot-upstream.conf)
#
# Certbot can upgrade this HTTP block to HTTPS after DNS is live.

server {
    listen 80;
    listen [::]:80;
    server_name biz.openbot.love;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    client_max_body_size 25m;

    # Strip client-supplied identity headers (defense in depth for cookie-native path).
    # BFF path would re-inject after auth_request; here the gateway uses session cookies.
    location / {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        proxy_pass         http://openbot_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        # Do not forward client X-Forwarded-User / X-Tenant-Id as authoritative.
        proxy_set_header   X-Forwarded-User  "";
        proxy_set_header   X-Tenant-Id       "";
        proxy_set_header   X-Gateway-Role    "";
        proxy_set_header   X-Gateway-Scopes  "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }

    access_log /var/log/nginx/biz.openbot.love.access.log;
    error_log  /var/log/nginx/biz.openbot.love.error.log;
}
