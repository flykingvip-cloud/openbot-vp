# Public apex + www (anonymous cookie-native reverse proxy)
# Requires: openbot_gateway upstream + map $connection_upgrade

server {
    listen 80;
    listen [::]:80;
    server_name openbot.love www.openbot.love;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    client_max_body_size 25m;

    # The enterprise console has one canonical origin. Keeping public-domain
    # enterprise routes alive would split host-only cookies and browser storage.
    location = /enterprise {
        return 308 https://biz.openbot.love$request_uri;
    }

    location ^~ /enterprise/ {
        return 308 https://biz.openbot.love$request_uri;
    }

    # Static installers + Mac zips must win over the SPA catch-all below.
    # Repo SoT: deploy/production/proxy/nginx/apex.openbot.love.conf
    # Host file after install-nginx.sh: /etc/nginx/conf.d/openbot.love.conf
    # (certbot may add listen 443 to this same server block — keep these
    # locations in the HTTPS server, before `location /`).
    #
    # Host must mkdir the docroot and copy THIS repo's scripts (there is no
    # sibling openbot.love website repo on this fork):
    #   mkdir -p /var/www/openbot-downloads
    #   cp scripts/install.sh /var/www/openbot-downloads/install.sh
    #   cp scripts/install-cli.sh /var/www/openbot-downloads/install-cli.sh
    #   cp scripts/install.ps1 /var/www/openbot-downloads/install.ps1
    #   nginx -t && systemctl reload nginx
    # /install-cli.sh is served from scripts/install-cli.sh (local-prefix CLI
    # installer). Reloading nginx without those files present still 404s; the
    # live SPA-HTML bug is not gone until copy+reload has run.

    location = /install.sh {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        alias /var/www/openbot-downloads/install.sh;
        types { }
        default_type application/x-sh;
        add_header Content-Disposition 'inline; filename="install.sh"';
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /install-cli.sh {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        alias /var/www/openbot-downloads/install-cli.sh;
        types { }
        default_type application/x-sh;
        add_header Content-Disposition 'inline; filename="install-cli.sh"';
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /install.ps1 {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        alias /var/www/openbot-downloads/install.ps1;
        types { }
        default_type text/plain;
        add_header Content-Disposition 'inline; filename="install.ps1"';
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Inlined from deploy/production/openbot-love-downloads.nginx.snippet.conf
    # so a single cp of this vhost actually serves /downloads/ (the snippet
    # was never included here, which is why only a host-side paste worked).
    location ^~ /downloads/ {
        alias /var/www/openbot-downloads/;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # Standalone public page: 消费品企业数智化自评器.
    # Must win over the SPA catch-all below (do not proxy this path).
    # Host:
    #   mkdir -p /var/www/openbot-pages/assess
    #   cp deploy/production/pages/assess/index.html /var/www/openbot-pages/assess/index.html
    #   nginx -t && systemctl reload nginx
    location = /assess {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        alias /var/www/openbot-pages/assess/index.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location = /assess/ {
        return 308 /assess;
    }

    # Admin UI for collected enterprise leads. HTTP basic auth on the host
    # file /etc/nginx/htpasswd-assess-admin (do not commit credentials).
    # Host: chown root:nginx && chmod 640 that file so workers can read it.
    location = /assess/admin {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        auth_basic "OpenBot Assess Admin";
        auth_basic_user_file /etc/nginx/htpasswd-assess-admin;
        alias /var/www/openbot-pages/assess/admin.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location = /assess/admin/ {
        return 308 /assess/admin;
    }
    location ^~ /assess/admin/api/ {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        auth_basic "OpenBot Assess Admin";
        auth_basic_user_file /etc/nginx/htpasswd-assess-admin;
        proxy_pass         http://127.0.0.1:18793/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Public questionnaire submit only. Listing is admin-only above.
    location = /assess/api/leads {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        limit_except POST {
            deny all;
        }
        proxy_pass         http://127.0.0.1:18793/leads;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Enterprise system intake. Same host install pattern as /assess.
    #   mkdir -p /var/www/openbot-pages/intake/api /var/lib/openbot-intake
    #   cp deploy/production/pages/intake/index.html /var/www/openbot-pages/intake/index.html
    #   cp deploy/production/pages/intake/admin.html /var/www/openbot-pages/intake/admin.html
    #   cp deploy/production/pages/intake/api/server.mjs /var/www/openbot-pages/intake/api/server.mjs
    #   install the systemd unit and nginx -t && systemctl reload nginx
    # Admin login reuses /etc/nginx/htpasswd-assess-admin. Do not commit that file.
    location = /intake {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        alias /var/www/openbot-pages/intake/index.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location = /intake/ {
        return 308 /intake;
    }
    location = /intake/admin {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        auth_basic "OpenBot Intake Admin";
        auth_basic_user_file /etc/nginx/htpasswd-assess-admin;
        alias /var/www/openbot-pages/intake/admin.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location = /intake/admin/ {
        return 308 /intake/admin;
    }
    location ^~ /intake/admin/api/ {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        auth_basic "OpenBot Intake Admin";
        auth_basic_user_file /etc/nginx/htpasswd-assess-admin;
        proxy_pass         http://127.0.0.1:18794/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /intake/api/submissions {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        limit_except POST {
            deny all;
        }
        proxy_pass         http://127.0.0.1:18794/submissions;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        if ($scheme = http) { return 308 https://$host$request_uri; }
        proxy_pass         http://openbot_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   X-Forwarded-User  "";
        proxy_set_header   X-Tenant-Id       "";
        proxy_set_header   X-Gateway-Role    "";
        proxy_set_header   X-Gateway-Scopes  "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }

    access_log /var/log/nginx/openbot.love.access.log;
    error_log  /var/log/nginx/openbot.love.error.log;
}
