<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Account Computer golden-path fixture — password login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 0.75rem; }
    input { width: 100%; box-sizing: border-box; padding: 0.4rem; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
    #status { margin-top: 1rem; color: #333; }
  </style>
</head>
<body>
  <!--
    Static fixture for manual / future e2e golden-path only.
    No real credentials. Do not point production traffic here.
  -->
  <h1>Sign in (fixture)</h1>
  <form id="login" action="#" method="post" autocomplete="off">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" />
    <button type="submit" id="submit">Sign in</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <script>
    document.getElementById("login").addEventListener("submit", function (event) {
      event.preventDefault();
      var user = document.getElementById("username").value || "";
      document.getElementById("status").textContent =
        "fixture-ok: submitted for " + (user || "(empty user)") + " (password not echoed)";
    });
  </script>
</body>
</html>
