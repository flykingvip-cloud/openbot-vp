<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Account Computer fixture — SMS OTP login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 0.75rem; }
    input { width: 100%; box-sizing: border-box; padding: 0.4rem; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
    #status { margin-top: 1rem; color: #333; }
  </style>
</head>
<body data-fixture="sms-otp" data-login-surface="sms">
  <!--
    Static fixture for phone + SMS OTP participation surface.
    No real SMS. Do not point production traffic here.
  -->
  <h1>手机验证码登录（夹具）</h1>
  <form id="sms-login" action="#" method="post" autocomplete="off">
    <label for="phone">手机号</label>
    <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" />
    <label for="otp">短信验证码</label>
    <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" />
    <button type="button" id="send-otp">获取验证码</button>
    <button type="submit" id="submit">登录</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <script>
    document.getElementById("send-otp").addEventListener("click", function () {
      document.getElementById("status").textContent = "fixture: otp sent (simulated, no SMS)";
    });
    document.getElementById("sms-login").addEventListener("submit", function (event) {
      event.preventDefault();
      var phone = document.getElementById("phone").value || "";
      document.getElementById("status").textContent =
        "fixture-ok: sms login for " + (phone || "(empty phone)") + " (otp not echoed)";
      document.body.setAttribute("data-signed-in", "true");
    });
  </script>
</body>
</html>
