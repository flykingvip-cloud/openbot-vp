      <stop offset="0" stop-color="#FBFCFE"/>
      <stop offset="1" stop-color="#EEF3FB"/>
    </linearGradient>
    <filter id="sh" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B3A6B" flood-opacity="0.12"/>
    </filter>
    <marker id="arB" markerWidth="12" markerHeight="12" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563EB"/>
    </marker>
    <marker id="arA" markerWidth="12" markerHeight="12" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#D97706"/>
    </marker>
    <style>
      .h1{font-size:34px;font-weight:700;fill:#0F2A5B}
      .h2{font-size:18px;fill:#46536E}
      .hub{font-size:18px;font-weight:700;fill:#0F2A5B}
      .hubsub{font-size:13px;fill:#5B6B85}
      .rail{font-size:14px;font-weight:700;fill:#6B7A97}
      .bxt{font-size:16px;font-weight:700}
      .bxtag{font-size:13px;fill:#5B6B85}
      .chip{font-size:13px;fill:#2B4A7E;text-anchor:middle}
      .legend{font-size:13px;fill:#46536E}
      .bdg{font-size:14px;font-weight:700;fill:#FFFFFF;text-anchor:middle}
      .iso{font-size:14px;fill:#7A4A0E}
      .ker{font-size:13px;fill:#7A4A0E}
      .at{font-size:15px;font-weight:700;fill:#334155}
      .al{font-size:14px;fill:#4A5A72}
      .ph{font-size:15px;font-weight:700;fill:#0F2A5B}
      .ps{font-size:12.5px;fill:#64748B}
      .ban{font-size:21px;fill:#EAF1FF;text-anchor:middle}
      .role{font-size:16px;font-weight:700;fill:#0F2A5B;text-anchor:middle}
      .rsub{font-size:12px;fill:#7A88A0;text-anchor:middle}
      .bnd{font-size:13px;fill:#48566E;text-anchor:middle}
      .flow{font-size:12px;font-weight:700}
    </style>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#bg)"/>

  <!-- Title -->
  <text x="64" y="60" class="h1">OpenBot 企业级 Agent 操作系统（Agent OS）</text>
  <text x="66" y="86" class="h2">两大中枢 · 八大支柱 · 数字能力架构</text>

  <!-- Legend -->
  <rect x="1544" y="30" width="340" height="58" rx="10" fill="#FFFFFF" stroke="#D7DEEA"/>
  <line x1="1560" y1="52" x2="1598" y2="52" stroke="#2563EB" stroke-width="3"/>
  <text x="1608" y="57" class="legend">调用流（自上而下 · 取数）</text>
  <line x1="1560" y1="74" x2="1598" y2="74" stroke="#D97706" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="1608" y="79" class="legend">事件流（自下而上 · Event Bus）</text>

  <!-- macro flow arrows -->
  <line x1="38" y1="150" x2="38" y2="900" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arB)"/>
  <text transform="rotate(-90 24 530)" x="24" y="530" class="flow" fill="#2563EB" text-anchor="middle">调用 · 取数流</text>
  <line x1="1646" y1="720" x2="1646" y2="300" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arA)"/>

  <!-- ===== Layer: Digital employees (Pillar 8) ===== -->
  <circle cx="76" cy="113" r="13" fill="#2E63C8"/>
  <text x="76" y="118" class="bdg">8</text>
  <text x="98" y="119" class="hub">数字员工 · Agent 运行层（Agent Runtime）</text>
  <text x="1636" y="119" class="hubsub" text-anchor="end">多 Agent 协作 · 数字岗位全面 Agent 化</text>

  <g>
    <!-- 6 employee cards, centers 180,448,716,984,1252,1520 -->
    <g>
      <rect x="64" y="132" width="232" height="114" rx="12" fill="#FFFFFF" stroke="#CBD9F0" filter="url(#sh)"/>
      <rect x="164" y="160" width="32" height="26" rx="7" fill="#EAF1FF" stroke="#2E63C8"/>
      <circle cx="174" cy="173" r="3" fill="#2E63C8"/><circle cx="186" cy="173" r="3" fill="#2E63C8"/>
      <line x1="180" y1="160" x2="180" y2="150" stroke="#2E63C8" stroke-width="2"/><circle cx="180" cy="148" r="3" fill="#2E63C8"/>
      <text x="180" y="212" class="role">新媒体运营</text><text x="180" y="232" class="rsub">Agent</text>
    </g>
    <g>
      <rect x="332" y="132" width="232" height="114" rx="12" fill="#FFFFFF" stroke="#CBD9F0" filter="url(#sh)"/>
      <rect x="432" y="160" width="32" height="26" rx="7" fill="#EAF1FF" stroke="#2E63C8"/>
      <circle cx="442" cy="173" r="3" fill="#2E63C8"/><circle cx="454" cy="173" r="3" fill="#2E63C8"/>
      <line x1="448" y1="160" x2="448" y2="150" stroke="#2E63C8" stroke-width="2"/><circle cx="448" cy="148" r="3" fill="#2E63C8"/>
      <text x="448" y="212" class="role">客户服务</text><text x="448" y="232" class="rsub">Agent</text>
    </g>
    <g>
      <rect x="600" y="132" width="232" height="114" rx="12" fill="#FFFFFF" stroke="#CBD9F0" filter="url(#sh)"/>
      <rect x="700" y="160" width="32" height="26" rx="7" fill="#EAF1FF" stroke="#2E63C8"/>
      <circle cx="710" cy="173" r="3" fill="#2E63C8"/><circle cx="722" cy="173" r="3" fill="#2E63C8"/>
      <line x1="716" y1="160" x2="716" y2="150" stroke="#2E63C8" stroke-width="2"/><circle cx="716" cy="148" r="3" fill="#2E63C8"/>
      <text x="716" y="212" class="role">销售助理</text><text x="716" y="232" class="rsub">Agent</text>
    </g>
    <g>
      <rect x="868" y="132" width="232" height="114" rx="12" fill="#FFFFFF" stroke="#CBD9F0" filter="url(#sh)"/>
      <rect x="968" y="160" width="32" height="26" rx="7" fill="#EAF1FF" stroke="#2E63C8"/>
      <circle cx="978" cy="173" r="3" fill="#2E63C8"/><circle cx="990" cy="173" r="3" fill="#2E63C8"/>
      <line x1="984" y1="160" x2="984" y2="150" stroke="#2E63C8" stroke-width="2"/><circle cx="984" cy="148" r="3" fill="#2E63C8"/>
      <text x="984" y="212" class="role">财务分析</text><text x="984" y="232" class="rsub">Agent</text>
    </g>
    <g>
      <rect x="1136" y="132" width="232" height="114" rx="12" fill="#FFFFFF" stroke="#CBD9F0" filter="url(#sh)"/>
      <rect x="1236" y="160" width="32" height="26" rx="7" fill="#EAF1FF" stroke="#2E63C8"/>
      <circle cx="1246" cy="173" r="3" fill="#2E63C8"/><circle cx="1258" cy="173" r="3" fill="#2E63C8"/>
      <line x1="1252" y1="160" x2="1252" y2="150" stroke="#2E63C8" stroke-width="2"/><circle cx="1252" cy="148" r="3" fill="#2E63C8"/>
      <text x="1252" y="212" class="role">HR 助理</text><text x="1252" y="232" class="rsub">Agent</text>
    </g>
    <g>
      <rect x="1404" y="132" width="232" height="114" rx="12" fill="#FFFFFF" stroke="#CBD9F0" filter="url(#sh)"/>
      <rect x="1504" y="160" width="32" height="26" rx="7" fill="#EAF1FF" stroke="#2E63C8"/>
      <circle cx="1514" cy="173" r="3" fill="#2E63C8"/><circle cx="1526" cy="173" r="3" fill="#2E63C8"/>
      <line x1="1520" y1="160" x2="1520" y2="150" stroke="#2E63C8" stroke-width="2"/><circle cx="1520" cy="148" r="3" fill="#2E63C8"/>
      <text x="1520" y="212" class="role">CEO 决策</text><text x="1520" y="232" class="rsub">Agent</text>
    </g>
  </g>

  <!-- ===== HUB 1: Gateway Control Plane container ===== -->
  <rect x="64" y="262" width="1572" height="482" rx="16" fill="#E8F1FF" stroke="#9DBEF0" filter="url(#sh)"/>
  <rect x="64" y="262" width="1572" height="40" rx="16" fill="#D3E4FF"/>
  <rect x="64" y="286" width="1572" height="16" fill="#D3E4FF"/>
  <text x="88" y="289" class="hub">中枢一　网关控制面（Gateway Control Plane）</text>
  <text x="1612" y="289" class="hubsub" text-anchor="end">承载 身份 · 能力 · 数据 · 知识 全栈网关能力</text>

  <!-- rail labels -->
  <text transform="rotate(-90 100 364)" x="100" y="364" class="rail" text-anchor="middle">能力与调度</text>
  <text transform="rotate(-90 100 514)" x="100" y="514" class="rail" text-anchor="middle">三大网关</text>
  <text transform="rotate(-90 100 664)" x="100" y="664" class="rail" text-anchor="middle">事件与连接</text>

  <!-- Sub-layer A: 能力中心(2) + Data Planner(4) -->
  <g>
    <rect x="132" y="308" width="722" height="112" rx="12" fill="#FFFFFF" stroke="#DCE4F1" filter="url(#sh)"/>
    <circle cx="154" cy="334" r="13" fill="#4F46E5"/><text x="154" y="339" class="bdg">2</text>
    <text x="176" y="340" class="bxt" fill="#4F46E5">能力中心 Capability Center</text>
    <text x="148" y="363" class="bxtag">授予“业务能力”，而非系统账号 / 管理员权限</text>
    <g>
      <rect x="148" y="376" width="84" height="26" rx="8" fill="#EEF3FC"/><text x="190" y="393" class="chip">发布文章</text>
      <rect x="240" y="376" width="84" height="26" rx="8" fill="#EEF3FC"/><text x="282" y="393" class="chip">回复评论</text>
      <rect x="332" y="376" width="84" height="26" rx="8" fill="#EEF3FC"/><text x="374" y="393" class="chip">分析销售</text>
      <rect x="424" y="376" width="84" height="26" rx="8" fill="#EEF3FC"/><text x="466" y="393" class="chip">查询库存</text>
      <rect x="516" y="376" width="84" height="26" rx="8" fill="#EEF3FC"/><text x="558" y="393" class="chip">生成报价</text>
      <rect x="608" y="376" width="84" height="26" rx="8" fill="#EEF3FC"/><text x="650" y="393" class="chip">导出报表</text>
    </g>
  </g>
  <g>
    <rect x="890" y="308" width="722" height="112" rx="12" fill="#FFFFFF" stroke="#DCE4F1" filter="url(#sh)"/>
    <circle cx="912" cy="334" r="13" fill="#7C3AED"/><text x="912" y="339" class="bdg">4</text>
    <text x="934" y="340" class="bxt" fill="#7C3AED">Agent 数据规划器 Data Planner</text>
    <text x="906" y="363" class="bxtag">面向任务决定“该取哪些数据” · Metadata First</text>
    <g>
      <rect x="906" y="378" width="70" height="26" rx="8" fill="#F1ECFD"/><text x="941" y="395" class="chip">任务</text>
      <text x="986" y="395" fill="#7C3AED" font-size="15" text-anchor="middle">→</text>
      <rect x="998" y="378" width="100" height="26" rx="8" fill="#F1ECFD"/><text x="1048" y="395" class="chip">查元数据目录</text>
      <text x="1108" y="395" fill="#7C3AED" font-size="15" text-anchor="middle">→</text>
      <rect x="1120" y="378" width="118" height="26" rx="8" fill="#F1ECFD"/><text x="1179" y="395" class="chip">生成数据计划</text>
      <text x="1248" y="395" fill="#7C3AED" font-size="15" text-anchor="middle">→</text>
      <rect x="1260" y="378" width="96" height="26" rx="8" fill="#F1ECFD"/><text x="1308" y="395" class="chip">按需取数</text>
    </g>
  </g>

  <!-- Sub-layer B: 身份网关(1) + 语义数据网关(3) + 知识网关(5) -->
  <g>
    <rect x="132" y="434" width="473" height="160" rx="12" fill="#FFFFFF" stroke="#DCE4F1" filter="url(#sh)"/>
    <circle cx="154" cy="462" r="13" fill="#0E9488"/><text x="154" y="467" class="bdg">1</text>
    <text x="176" y="468" class="bxt" fill="#0E9488">身份网关 Identity Gateway</text>
    <text x="148" y="491" class="bxtag">Agent 调用身份，不持有账号密码</text>
    <rect x="148" y="502" width="441" height="76" rx="10" fill="#F2FBFA" stroke="#0E9488"/>
    <text x="164" y="526" font-size="14" font-weight="700" fill="#0B6E68">身份保险库 Vault</text>
    <text x="164" y="548" font-size="13" fill="#3B6E69">OAuth / Token / Cookie 加密托管（KMS 可外置）</text>
    <text x="164" y="568" font-size="13" fill="#3B6E69">· 授权随时可回收 · Agent 无法读取明文</text>
  </g>
  <g>
    <rect x="635" y="434" width="473" height="160" rx="12" fill="#FFFFFF" stroke="#DCE4F1" filter="url(#sh)"/>
    <circle cx="657" cy="462" r="13" fill="#2563EB"/><text x="657" y="467" class="bdg">3</text>
    <text x="679" y="468" class="bxt" fill="#2563EB">语义数据网关 Semantic Data Gateway</text>
    <text x="651" y="491" class="bxtag">Metadata First · Data On Demand</text>
    <rect x="651" y="500" width="441" height="30" rx="8" fill="#EEF3FC"/>
    <text x="871" y="520" class="chip">企业对象模型：客户 · 订单 · 产品 · 库存</text>
    <rect x="651" y="538" width="258" height="30" rx="8" fill="#EEF3FC"/>
    <text x="780" y="558" class="chip">元数据目录 Metadata Catalog</text>
    <rect x="919" y="538" width="173" height="30" rx="8" fill="#FDECEC"/>
    <text x="1005" y="558" font-size="13" fill="#C0392B" text-anchor="middle">不落业务数据</text>
  </g>
  <g>
    <rect x="1138" y="434" width="473" height="160" rx="12" fill="#FFFFFF" stroke="#DCE4F1" filter="url(#sh)"/>
    <circle cx="1160" cy="462" r="13" fill="#059669"/><text x="1160" y="467" class="bdg">5</text>
    <text x="1182" y="468" class="bxt" fill="#059669">知识网关 Knowledge Gateway</text>
    <text x="1154" y="491" class="bxtag">RAG 检索增强 · 非结构化知识按需召回</text>
    <g>
      <rect x="1154" y="502" width="72" height="26" rx="8" fill="#E9F7F1"/><text x="1190" y="519" class="chip">制度</text>
      <rect x="1238" y="502" width="72" height="26" rx="8" fill="#E9F7F1"/><text x="1274" y="519" class="chip">流程</text>
      <rect x="1322" y="502" width="72" height="26" rx="8" fill="#E9F7F1"/><text x="1358" y="519" class="chip">合同</text>
      <rect x="1154" y="536" width="72" height="26" rx="8" fill="#E9F7F1"/><text x="1190" y="553" class="chip">PDF</text>
      <rect x="1238" y="536" width="72" height="26" rx="8" fill="#E9F7F1"/><text x="1274" y="553" class="chip">PPT</text>
      <rect x="1322" y="536" width="72" height="26" rx="8" fill="#E9F7F1"/><text x="1358" y="553" class="chip">文档</text>
    </g>
  </g>

  <!-- Sub-layer C: 事件总线(6) + 连接器层 -->
  <g>
    <rect x="132" y="608" width="722" height="112" rx="12" fill="#FFFFFF" stroke="#DCE4F1" filter="url(#sh)"/>
    <circle cx="154" cy="634" r="13" fill="#D97706"/><text x="154" y="639" class="bdg">6</text>
    <text x="176" y="640" class="bxt" fill="#D97706">事件总线 Event Bus</text>
    <text x="148" y="663" class="bxtag">由“拉”到“推”：企业系统 Webhook → 事件 → Agent 触发</text>
    <g>
      <rect x="148" y="676" width="216" height="28" rx="8" fill="#FDF3E4"/><text x="256" y="695" class="chip">新增订单 → 销售 Agent</text>
      <rect x="376" y="676" width="216" height="28" rx="8" fill="#FDF3E4"/><text x="484" y="695" class="chip">新建工单 → 客服 Agent</text>
    </g>
  </g>
  <g>
    <rect x="890" y="608" width="722" height="112" rx="12" fill="#FFFFFF" stroke="#DCE4F1" filter="url(#sh)"/>
    <circle cx="912" cy="634" r="13" fill="#475569"/><text x="912" y="639" class="bdg">·</text>
    <text x="934" y="640" class="bxt" fill="#475569">连接器层 Connector Layer</text>
    <text x="906" y="663" class="bxtag">统一接入 ERP / CRM / OA / 数据库 / 外部 API</text>
    <g>
      <rect x="906" y="676" width="100" height="28" rx="8" fill="#EEF1F6"/><text x="956" y="695" class="chip">Salesforce</text>
      <rect x="1016" y="676" width="58" height="28" rx="8" fill="#EEF1F6"/><text x="1045" y="695" class="chip">SAP</text>
      <rect x="1084" y="676" width="74" height="28" rx="8" fill="#EEF1F6"/><text x="1121" y="695" class="chip">Notion</text>
      <rect x="1168" y="676" width="104" height="28" rx="8" fill="#EEF1F6"/><text x="1220" y="695" class="chip">HTTP REST</text>
      <rect x="1282" y="676" width="114" height="28" rx="8" fill="#EEF1F6"/><text x="1339" y="695" class="chip">PostgreSQL</text>
      <rect x="1406" y="676" width="80" height="28" rx="8" fill="#EEF1F6"/><text x="1446" y="695" class="chip">MySQL</text>
    </g>
  </g>

  <!-- ===== HUB 2: Governance Kernel (Pillar 7) ===== -->
  <rect x="1656" y="132" width="228" height="612" rx="14" fill="#FFF6E9" stroke="#E7A44D" filter="url(#sh)"/>
  <rect x="1656" y="132" width="228" height="60" rx="14" fill="#FBE3BE"/>
  <rect x="1656" y="166" width="228" height="26" fill="#FBE3BE"/>
  <text x="1770" y="158" font-size="13" fill="#8A5A12" text-anchor="middle">中枢二</text>
  <text x="1770" y="182" font-size="18" font-weight="700" fill="#7A4A0E" text-anchor="middle">治理内核 Fabric</text>
  <circle cx="1694" cy="224" r="13" fill="#E08A2B"/><text x="1694" y="229" class="bdg">7</text>
  <text x="1714" y="229" font-size="14" font-weight="700" fill="#7A4A0E">安全治理</text>

  <text x="1676" y="266" font-size="13" font-weight="700" fill="#8A5A12">四层隔离</text>
  <rect x="1678" y="280" width="14" height="14" rx="3" fill="#E08A2B"/><text x="1702" y="292" class="iso">身份隔离 Identity</text>
  <rect x="1678" y="308" width="14" height="14" rx="3" fill="#E08A2B"/><text x="1702" y="320" class="iso">权限隔离 Permission</text>
  <rect x="1678" y="336" width="14" height="14" rx="3" fill="#E08A2B"/><text x="1702" y="348" class="iso">数据隔离 Data</text>
  <rect x="1678" y="364" width="14" height="14" rx="3" fill="#E08A2B"/><text x="1702" y="376" class="iso">审计隔离 Audit</text>

  <line x1="1676" y1="400" x2="1866" y2="400" stroke="#E7C79A" stroke-width="1.5"/>

  <text x="1676" y="428" font-size="13" font-weight="700" fill="#8A5A12">统一治理引擎</text>
  <text x="1676" y="456" class="ker">· Policy Engine 策略引擎</text>
  <text x="1676" y="482" class="ker">· 审计追溯 Audit Trail</text>
  <text x="1676" y="508" class="ker">· 成本管控 Cost</text>
  <text x="1676" y="534" class="ker">· 租户隔离 Tenancy</text>

  <rect x="1670" y="640" width="200" height="86" rx="10" fill="#FBEFD8"/>
  <text x="1770" y="670" font-size="13" font-weight="700" fill="#7A4A0E" text-anchor="middle">全链路可审计</text>
  <text x="1770" y="692" font-size="13" font-weight="700" fill="#7A4A0E" text-anchor="middle">可回收 · 可治理</text>
  <text x="1770" y="713" font-size="11.5px" fill="#9A6A1E" text-anchor="middle">编译期决策 · 运行期强制</text>

  <!-- ===== Platform boundary ===== -->
  <line x1="48" y1="762" x2="1884" y2="762" stroke="#9AA7BC" stroke-width="1.5" stroke-dasharray="8 6"/>
  <rect x="606" y="748" width="708" height="28" rx="14" fill="#FFFFFF" stroke="#C7D0DE"/>
  <text x="960" y="767" class="bnd">平台边界　OpenBot 不进入系统、不搬运业务数据，仅经网关按需访问</text>

  <!-- ===== Enterprise assets ===== -->
  <g>
    <rect x="64" y="792" width="585" height="114" rx="12" fill="#EEF1F6" stroke="#C7D0DE"/>
    <rect x="64" y="792" width="6" height="114" rx="3" fill="#DB2777"/>
    <text x="84" y="822" class="at">企业数字身份</text>
    <text x="84" y="852" class="al">微信公众号 · 微博 · 抖音 · 小红书</text>
    <text x="84" y="880" class="al">视频号 · 企业邮箱 · LinkedIn · X</text>
  </g>
  <g>
