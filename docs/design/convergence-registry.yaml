    retirementTarget: none

  - responsibility: operational-identity-binding
    intent: Governed operational identities usable by an employee without exposing credentials.
    currentOwners:
      - src/gateway/user-operational-identity-types.ts
      - src/gateway/user-operational-identity-access.ts
    canonicalOwner: src/gateway/user-operational-identity-types.ts
    mode: extend
