# OpenBot Fly.io deployment configuration
# See https://fly.io/docs/reference/configuration/

app = "openbot"
primary_region = "iad" # change to your closest region

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
# Fly uses x86, but keep this for consistency
OPENCLAW_PREFER_PNPM = "1"
OPENCLAW_STATE_DIR = "/data"
NODE_OPTIONS = "--max-old-space-size=1536"

[processes]
# Production intentionally fails closed until /data contains gateway.mode=local,
# gateway authentication, and an explicit https://openbot.fly.dev Control UI origin.
#
# Bind choice (security): Fly's proxy reaches the process over the Machine's private
# network, so a loopback-only bind cannot serve [http_service] traffic. `--bind lan`
# is therefore the MINIMAL WORKING bind for this topology — it is NOT permission to
# run a bare Control UI on the public internet. The gateway is only reachable through
# Fly's http_service (force_https below); never expose port 3000 via a public IP or
# extra [[services]] entry. Required before real traffic (SECURITY.md "Web Interface
# Safety", deploy/production/README.md red lines R3-R5):
#   - gateway.auth: token/password (OPENBOT_GATEWAY_TOKEN via `fly secrets set`),
#     or trusted-proxy mode with gateway.trustedProxies pinned to the proxy address
#   - gateway.controlUi.allowedOrigins: your exact https origin(s), no "*"
# Hosted instances must also set session.maintenance.mode="enforce" with a disk
# budget (see deploy/production/openbot.production.example.json5) or this small
# volume fills before any governance action happens.
app = "node dist/index.js gateway --port 3000 --bind lan"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = false # Keep running for persistent connections
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

# Gate rolling releases on gateway readiness, including configured channel health.
[[http_service.checks]]
grace_period = "60s"
interval = "15s"
method = "GET"
timeout = "10s"
path = "/readyz"

[[vm]]
size = "shared-cpu-2x"
memory = "2048mb"

[mounts]
source = "openclaw_data"
destination = "/data"
