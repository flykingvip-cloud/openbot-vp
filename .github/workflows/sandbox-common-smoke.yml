name: Sandbox Common Smoke

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.sandbox
      - Dockerfile.sandbox-common
      - scripts/sandbox-common-setup.sh
      - scripts/sandbox-setup.sh
      - scripts/sandbox-image-smoke.sh
  pull_request:
    paths:
      - Dockerfile.sandbox
      - Dockerfile.sandbox-common
      - scripts/sandbox-common-setup.sh
      - scripts/sandbox-setup.sh
      - scripts/sandbox-image-smoke.sh

concurrency:
  group: sandbox-common-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sandbox-common-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build conversation sandbox and smoke Node, Chromium, poppler, uid
        shell: bash
        run: |
          set -euo pipefail
          docker build -t openbot-sandbox:bookworm-slim -f Dockerfile.sandbox .
          scripts/sandbox-image-smoke.sh openbot-sandbox:bookworm-slim

      - name: Build sandbox-common image (root for installs, sandbox at runtime)
        shell: bash
        run: |
          set -euo pipefail

          BASE_IMAGE="openbot-sandbox:bookworm-slim" \
            TARGET_IMAGE="openclaw-sandbox-common-smoke:bookworm-slim" \
            PACKAGES="ca-certificates" \
            INSTALL_PNPM=0 \
            INSTALL_BUN=0 \
            INSTALL_BREW=0 \
            FINAL_USER=sandbox \
            scripts/sandbox-common-setup.sh

          u="$(docker run --rm openclaw-sandbox-common-smoke:bookworm-slim sh -lc 'id -un')"
          test "$u" = "sandbox"
          uid="$(docker run --rm openclaw-sandbox-common-smoke:bookworm-slim sh -lc 'id -u')"
          gid="$(docker run --rm openclaw-sandbox-common-smoke:bookworm-slim sh -lc 'id -g')"
          test "$uid" = "1000"
          test "$gid" = "1000"
