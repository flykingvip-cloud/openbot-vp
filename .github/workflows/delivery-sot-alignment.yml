name: Delivery SoT alignment

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - deploy/production/RELEASE_RECORD.md
      - deploy/production/LEDGER.md
      - scripts/delivery/**

permissions:
  contents: read

jobs:
  forward-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The machine ledger now lives in OHBE (deploy/production/LEDGER.md). When the
      # local JSONL is absent, delivery:check-sot still requires a resolved LIVE to be
      # contained in origin/main and reports verdict=external. It does not compare an
      # open ledger row, because that row is no longer in this repo.
      # The frozen release/baseline-recovery branch is never consulted, so its lag can no
      # longer produce a false failure.
      - name: Ensure trunk ref is available
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Assert production LIVE is anchored to the trunk
        run: >-
          pnpm delivery:check-sot --
          --use-release-record-live
          --trunk-ref origin/main
