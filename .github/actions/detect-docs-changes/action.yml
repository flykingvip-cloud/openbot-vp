name: Detect docs-only changes
description: >
  Outputs docs_only=true when all changed files are under docs/ or are
  product markdown (.md/.mdx outside .kiro/). Fail-safe: if detection
  fails, outputs false (run everything). Uses git diff — no API calls,
  no extra permissions needed.

outputs:
  docs_only:
    description: "'true' if all changes are docs/markdown, 'false' otherwise"
    value: ${{ steps.check.outputs.docs_only }}
  docs_changed:
    description: "'true' if any changed file is under docs/ or is markdown"
    value: ${{ steps.check.outputs.docs_changed }}

runs:
  using: composite
  steps:
    - name: Detect docs-only changes
      id: check
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          BASE="${{ github.event.before }}"
        else
          # Use the exact base SHA from the event payload — stable regardless
          # of base branch movement (avoids origin/<ref> drift).
          BASE="${{ github.event.pull_request.base.sha }}"
        fi

        # Fail-safe: if we can't diff, assume non-docs (run everything)
        CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || echo "UNKNOWN")
        if [ "$CHANGED" = "UNKNOWN" ] || [ -z "$CHANGED" ]; then
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "docs_changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Product docs only: docs/** plus root/non-spec markdown.
        # .kiro/** specs, deploy notes, bundled skills, and CHANGELOG are not
        # Mintlify docs and must not trip check-docs.
        DOCS=$(echo "$CHANGED" | grep -E '^docs/|\.md$|\.mdx$' | grep -vE '^\.kiro/|^deploy/|^skills/|^CHANGELOG\.md$' || true)
        if [ -n "$DOCS" ]; then
          echo "docs_changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "docs_changed=false" >> "$GITHUB_OUTPUT"
        fi

        # .kiro markdown is spec/design, so it keeps docs_only=false.
        NON_DOCS=$(echo "$CHANGED" | grep -vE '^docs/|\.md$|\.mdx$' || true)
        KIRO_MD=$(echo "$CHANGED" | grep -E '^\.kiro/.*\.(md|mdx)$' || true)
        if [ -z "$NON_DOCS" ] && [ -z "$KIRO_MD" ]; then
          echo "docs_only=true" >> "$GITHUB_OUTPUT"
          echo "Docs-only change detected — skipping heavy jobs"
        else
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
        fi
